services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEMO_MODE=mock

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    ports:
      - "3000:8080"        # UBI 9 nginx listens on 8080, not 80
    depends_on:
      - backend
    environment:
      # HOST_IP is set at build time via --build-arg or env var (see commands below)
      - VITE_API_BASE_URL=http://${HOST_IP:-localhost}:8000/api
